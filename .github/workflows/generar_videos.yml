name: Generar Videos Virales por Dia

on:
  workflow_dispatch:
    inputs:
      videos_por_dia:
        description: 'Cantidad de videos por dia'
        required: true
        default: '1'
      tematica:
        description: 'Tematica (aleatorio o todo)'
        required: true
        default: 'aleatorio'

jobs:
  construir-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar dependencias del sistema operativo (MoviePy y PIL)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libmagickwand-dev imagemagick

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow moviepy

      - name: Ejecutar generador de videos por dia
        run: |
          python por_dia.py --videos ${{ github.event.inputs.videos_por_dia }} --tema ${{ github.event.inputs.tematica }}

      - name: Verificar y asegurar existencia del archivo ZIP
        run: |
          echo "Buscando archivos ZIP generados..."
          find . -name "*.zip"
          # Por si el script de python no empaquetó, forzamos un ZIP de respaldo con la salida
          if [ -d "videos_salida" ]; then
            zip -r videos_generados_forzado.zip videos_salida/
          fi

      - name: Subir videos como Artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mis-videos-generados
          path: |
            *.zip
            videos_salida/*.zip
