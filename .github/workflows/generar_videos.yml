name: Generador de Videos Virales

on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'Numero de videos por dia'
        required: true
        default: '5'
        type: string
      tema:
        description: 'Tema especifico o aleatorio'
        required: true
        default: 'aleatorio'
        type: string
  schedule:
    - cron: '0 8 * * *'

jobs:
  construir-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Actualizar pip e instalar dependencias obligatorias
        run: |
          python -m pip install --upgrade pip
          pip install moviepy==1.0.3 requests pillow

      - name: Instalar fuentes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu

      - name: Ejecutar generador de videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python por_dia.py --videos ${{ github.event.inputs.videos || 5 }} --tema ${{ github.event.inputs.tema || 'aleatorio' }}
